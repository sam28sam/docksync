    <g font-family="Arial,Helvetica,sans-serif"><text x="64" y="74" font-size="20" fill="#625d55" font-weight="500" letter-spacing="2">MAKE THE BOOKING ROUTE EASIER TO USE</text><rect x="64" y="128" width="505" height="467" rx="5" fill="#fff" stroke="#dedbd3"/><text x="100" y="191" font-size="25" fill="#111110" font-weight="700" >ONE AGREED PROCESS</text><text x="100" y="237" font-size="21" fill="#6b6a67" font-weight="400" >Warehouse + suppliers + carriers</text><rect x="100" y="279" width="433" height="66" rx="5" fill="#f5f4f0" stroke="#dedbd3"/><rect x="115" y="295" width="34" height="34" rx="5" fill="#e8960c" stroke="none"/><path d="M124 312l6 6 11-13" stroke="#111110" stroke-width="3" fill="none"/><text x="166" y="321" font-size="24" fill="#3d3c3a" font-weight="500" >See workable slots</text><rect x="100" y="366" width="433" height="66" rx="5" fill="#f5f4f0" stroke="#dedbd3"/><rect x="115" y="382" width="34" height="34" rx="5" fill="#e8960c" stroke="none"/><path d="M124 399l6 6 11-13" stroke="#111110" stroke-width="3" fill="none"/><text x="166" y="408" font-size="24" fill="#3d3c3a" font-weight="500" >Book against clear rules</text><rect x="100" y="453" width="433" height="66" rx="5" fill="#f5f4f0" stroke="#dedbd3"/><rect x="115" y="469" width="34" height="34" rx="5" fill="#e8960c" stroke="none"/><path d="M124 486l6 6 11-13" stroke="#111110" stroke-width="3" fill="none"/><text x="166" y="495" font-size="24" fill="#3d3c3a" font-weight="500" >Keep one agreed record</text><rect x="634" y="145" width="61" height="61" rx="5" fill="#111516" stroke="none"/><text x="648" y="184" font-size="23" fill="#f0eeea" font-weight="500" >01</text><text x="720" y="184" font-size="27" fill="#111110" font-weight="700" >Pilot with regular users</text><path d="M665 215v31" stroke="#c3bfb5" stroke-width="2"/><rect x="634" y="257" width="61" height="61" rx="5" fill="#111516" stroke="none"/><text x="648" y="296" font-size="23" fill="#f0eeea" font-weight="500" >02</text><text x="720" y="296" font-size="27" fill="#111110" font-weight="700" >Agree the rules</text><path d="M665 327v31" stroke="#c3bfb5" stroke-width="2"/><rect x="634" y="369" width="61" height="61" rx="5" fill="#111516" stroke="none"/><text x="648" y="408" font-size="23" fill="#f0eeea" font-weight="500" >03</text><text x="720" y="408" font-size="27" fill="#111110" font-weight="700" >Own the exceptions</text><path d="M665 439v31" stroke="#c3bfb5" stroke-width="2"/><rect x="634" y="481" width="61" height="61" rx="5" fill="#111516" stroke="none"/><text x="648" y="520" font-size="23" fill="#f0eeea" font-weight="500" >04</text><text x="720" y="520" font-size="27" fill="#111110" font-weight="700" >Measure adoption</text><text x="64" y="661" font-size="18" fill="#6b6a67" font-weight="500" letter-spacing="1.5">THE ROLLOUT IS THE OPERATING AGREEMENT AROUND IT.</text></g></svg>