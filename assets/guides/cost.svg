    <g font-family="Arial,Helvetica,sans-serif"><text x="64" y="75" font-size="20" fill="#bdc0bb" font-weight="500" letter-spacing="3">THE COST OF A NORMAL BOOKING WEEK</text><text x="64" y="172" font-size="47" fill="#f0eeea" font-weight="700" >Phone. Email. Spreadsheet.</text><rect x="64" y="235" width="670" height="76" rx="5" fill="#1b1f20" stroke="#3c403f"/><text x="88" y="282" font-size="28" fill="#f0eeea" font-weight="500" >100 appointments</text><text x="493" y="282" font-size="22" fill="#b8b4ae" font-weight="400" >× 6 minutes</text><rect x="64" y="328" width="670" height="76" rx="5" fill="#1b1f20" stroke="#3c403f"/><text x="88" y="375" font-size="28" fill="#f0eeea" font-weight="500" >30 changes &amp; chases</text><text x="493" y="375" font-size="22" fill="#b8b4ae" font-weight="400" >× 5 minutes</text><text x="64" y="475" font-size="31" fill="#f0eeea" font-weight="700" >12.5 ADMIN HOURS</text><text x="64" y="521" font-size="23" fill="#b8b4ae" font-weight="400" >At £22 per hour</text><rect x="788" y="232" width="348" height="326" rx="5" fill="#e8960c" stroke="none"/><text x="820" y="281" font-size="19" fill="#352000" font-weight="700" letter-spacing="2">BOOKING ADMIN</text><text x="820" y="369" font-size="83" fill="#111110" font-weight="700" >£275</text><text x="822" y="407" font-size="25" fill="#352000" font-weight="400" >per week</text><path d="M820 437h280" stroke="#11111033"/><text x="820" y="487" font-size="30" fill="#111110" font-weight="700" >£14,300 / year</text><text x="820" y="525" font-size="20" fill="#352000" font-weight="400" >52 similar weeks</text><text x="64" y="636" font-size="17" fill="#b8b4ae" font-weight="400" letter-spacing="1">ILLUSTRATIVE INPUTS · CURRENT PROCESS COST, NOT A SAVINGS PROMISE</text></g></svg>