    <g font-family="Arial,Helvetica,sans-serif"><text x="64" y="74" font-size="20" fill="#625d55" font-weight="500" letter-spacing="2">AN EMPTY DOOR IS ONLY PART OF THE PICTURE</text><rect x="64" y="124" width="390" height="477" rx="5" fill="#111516" stroke="none"/><rect x="127" y="191" width="264" height="301" rx="5" fill="#e8960c" stroke="none"/><rect x="149" y="214" width="220" height="278" rx="5" fill="#222a2b" stroke="none"/><path d="M164 245h190" stroke="#6c726b" stroke-width="3"/><path d="M164 280h190" stroke="#6c726b" stroke-width="3"/><path d="M164 315h190" stroke="#6c726b" stroke-width="3"/><path d="M164 350h190" stroke="#6c726b" stroke-width="3"/><path d="M164 385h190" stroke="#6c726b" stroke-width="3"/><path d="M164 420h190" stroke="#6c726b" stroke-width="3"/><path d="M164 455h190" stroke="#6c726b" stroke-width="3"/><rect x="104" y="490" width="329" height="19" rx="0" fill="#697169" stroke="none"/><text x="121" y="558" font-size="27" fill="#f0eeea" font-weight="700" >THE DOOR IS FREE.</text><text x="510" y="168" font-size="38" fill="#111110" font-weight="700" >IS THE OPERATION?</text><rect x="510" y="207" width="626" height="60" rx="5" fill="#fff" stroke="#dedbd3"/><text x="532" y="246" font-size="23" fill="#955b00" font-weight="500" >01</text><text x="590" y="246" font-size="26" fill="#3d3c3a" font-weight="500" >Suitable door</text><rect x="510" y="282" width="626" height="60" rx="5" fill="#fff" stroke="#dedbd3"/><text x="532" y="321" font-size="23" fill="#955b00" font-weight="500" >02</text><text x="590" y="321" font-size="26" fill="#3d3c3a" font-weight="500" >Receiving team</text><rect x="510" y="357" width="626" height="60" rx="5" fill="#fff" stroke="#dedbd3"/><text x="532" y="396" font-size="23" fill="#955b00" font-weight="500" >03</text><text x="590" y="396" font-size="26" fill="#3d3c3a" font-weight="500" >Load type &amp; time</text><rect x="510" y="432" width="626" height="60" rx="5" fill="#fff" stroke="#dedbd3"/><text x="532" y="471" font-size="2